<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PDV · clic reservas</title>
<link rel="icon" href="/logo-clic.png">
<link rel="stylesheet" href="/assets/clic.css?v=4">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
body{min-height:100vh}
.topo{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--linha);gap:8px;flex-wrap:wrap}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px}
.areas button{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:22px 10px;color:var(--txt);font:800 18px Archivo;cursor:pointer}
.areas button i{display:block;font-size:34px;color:var(--laranja);margin-bottom:6px}
.venda{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 60px)}
@media(max-width:820px){.venda{grid-template-columns:1fr}}
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px;align-content:start}
.item{background:var(--card);border:1px solid var(--linha);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;color:var(--txt);padding:0;font-family:Archivo}
.item .img{aspect-ratio:4/3;background:#1d1d1d center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;color:#444}
.item .t{padding:8px 10px}.item b{display:block;font-size:14px}.item span{color:var(--laranja2);font-weight:800}
.item.off{opacity:.4;pointer-events:none}
.lado{background:var(--bg2);border-left:1px solid var(--linha);padding:14px;display:flex;flex-direction:column}
.cart{flex:1;overflow:auto}
.cl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);gap:8px}
.cl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha2);background:none;color:var(--txt);cursor:pointer}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.formas button{padding:12px 6px;border-radius:12px;border:1px solid var(--linha2);background:none;color:var(--txt);font:700 14px Archivo;cursor:pointer}
.formas button.on{background:var(--laranja);border-color:var(--laranja);color:#000}
.total{font-size:30px;font-weight:900}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/assets/config.js?v=4"></script>
<script src="/assets/clic.js?v=4"></script>
</head>
<body>
<div class="topo"><a class="logo" href="/painel/"><img src="/logo-clic.png" alt=""> <span id="t-casa">PDV</span></a><div id="t-acoes" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
<div id="tela"><div class="vazio muted" style="padding:40px;text-align:center">Carregando…</div></div>
<script src="/pdv/pdv.js?v=1"></script>
</body>
</html>
