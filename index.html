<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clic Reservas — em breve</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111318; color: #f4f2ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  .caixa { max-width: 520px; }
  .marca { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .marca span { color: #f26b1d; }
  p { margin-top: 16px; font-size: 20px; line-height: 1.5; color: #c9c6c0; }
  .selo {
    display: inline-block; margin-top: 28px; padding: 10px 22px; border-radius: 999px;
    background: #f26b1d; color: #111318; font-weight: 700; font-size: 18px;
  }
  footer { position: fixed; bottom: 16px; left: 0; right: 0; font-size: 14px; color: #8a877f; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="marca">Clic <span>Reservas</span></div>
    <p>Lista, portaria e venda de ingressos para casas noturnas e eventos.</p>
    <div class="selo">Em breve</div>
  </div>
  <footer>Clic Reservas · Tela v1.0 · 12/11/2026</footer>
</body>
</html>
