<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A" id="meta-cor">
<title>Ingressos</title>
<link rel="icon" id="favicon" href="/logo-clic.png">
<link rel="apple-touch-icon" id="apple-icon" href="/logo-clic.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--dest:#FF5A1F;--fundo:#0A0A0A;--card:#151515;--linha:#262626;--txt:#F4F4F4;--txt2:#C9C9C9;--txt3:#8C8C8C;--ok:#00D26A;--erro:#FF4D4D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:var(--dest);text-decoration:none}
h1,h2,h3{margin:0 0 .4em;font-weight:900;letter-spacing:-.01em;line-height:1.1}
p{margin:0 0 1em;color:var(--txt2)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fundo) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
header.app .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.marca{display:flex;align-items:center;gap:10px;color:var(--txt);font-weight:900;font-size:18px}
.marca img{height:38px;width:auto;max-width:140px;object-fit:contain}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--txt3)}
main{padding-bottom:90px;min-height:70vh}
nav.baixo{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--fundo) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.baixo a{flex:1;text-align:center;padding:9px 0 8px;color:var(--txt3);font-size:12px;font-weight:600;position:relative}
nav.baixo a i{display:block;font-size:23px}
nav.baixo a.on{color:var(--dest)}
nav.baixo .bolha{position:absolute;top:4px;left:calc(50% + 6px);background:var(--dest);color:#000;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3A3A3A;background:transparent;color:var(--txt);padding:12px 18px;border-radius:999px;font:700 15px Archivo,sans-serif;cursor:pointer}
.btn.prim{background:var(--dest);border-color:var(--dest);color:#0A0A0A}
.btn.full{width:100%}.btn.peq{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--dest) 20%,transparent);color:var(--dest)}
.pill.cinza{background:#1f1f1f;color:var(--txt3)}.pill.verde{background:#08321c;color:var(--ok)}
.muted{color:var(--txt3)}.small{font-size:13px}
label{display:block;font-size:13px;color:var(--txt3);margin:12px 0 5px}
input,select,textarea{width:100%;background:#0d0d0d;border:1px solid #3A3A3A;color:var(--txt);border-radius:10px;padding:12px;font:15px Archivo,sans-serif}
input:focus,select:focus{outline:none;border-color:var(--dest)}
input[type=checkbox]{width:auto;accent-color:var(--dest)}
.erro{color:var(--erro);font-size:14px;margin-top:8px}
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;background:#111 center/cover no-repeat;overflow:hidden}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,var(--fundo) 96%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:28px;width:100%}
.hero h1{font-size:clamp(34px,8vw,64px)}
.hero h1 em{font-style:normal;color:var(--dest)}
.contador{display:flex;gap:8px;margin:16px 0}
.contador div{background:rgba(0,0,0,.55);border:1px solid var(--linha);border-radius:12px;padding:8px 10px;text-align:center;min-width:62px}
.contador b{display:block;font-size:24px;font-weight:900}.contador span{font-size:11px;color:var(--txt3)}
section.sec{padding:34px 0;border-top:1px solid var(--linha)}
.datas{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.datas button{flex:0 0 auto;width:62px;border-radius:14px;border:1px solid var(--linha);background:var(--card);color:var(--txt);padding:8px 0;font:800 20px Archivo;cursor:pointer}
.datas button small{display:block;font-size:11px;color:var(--txt3);font-weight:700}
.datas button.on{background:var(--dest);color:#000;border-color:var(--dest)}.datas button.on small{color:#000}
.evcard{display:block;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--linha);margin-bottom:16px;color:var(--txt)}
.evcard .capa{aspect-ratio:16/10;background:#1a1a1a center/cover no-repeat;position:relative}
.evcard .capa .data{position:absolute;left:12px;top:12px;background:var(--dest);color:#000;border-radius:12px;padding:4px 10px;font-weight:900;text-align:center;line-height:1.1}
.evcard .info{padding:14px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{background:var(--card);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.prod .img{aspect-ratio:1;background:#1a1a1a center/cover}
.prod .p{padding:10px}
.lote{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;background:var(--card)}
.lote.off{opacity:.5}
.qtd{display:flex;align-items:center;gap:10px}
.qtd button{width:36px;height:36px;border-radius:50%;border:1px solid #3A3A3A;background:none;color:var(--txt);font-size:20px;cursor:pointer}
.qtd b{min-width:18px;text-align:center}
.mapa svg{width:100%;border-radius:14px;background:#101010;border:1px solid var(--linha)}
.mapa g.area{cursor:pointer}.mapa g.area.sel rect{stroke:#fff;stroke-width:.8}
.mapa g.area.apaga{opacity:.25}
.bus{display:inline-block;background:#1a1a1a;border:2px solid #333;border-radius:26px 26px 14px 14px;padding:14px 10px}
.bus .fil{display:grid;grid-template-columns:repeat(5,34px);gap:6px;margin-bottom:6px}
.bus .s{height:34px;border-radius:8px 8px 4px 4px;border:none;font:700 12px Archivo;cursor:pointer;color:#000}
.bus .s.oc{background:#2a2a2a!important;color:#555;cursor:not-allowed}
.bus .s.sel{outline:3px solid #fff}
.bus .f{height:34px;border-radius:6px;background:#262626;color:#777;font-size:10px;display:flex;align-items:center;justify-content:center}
.linha-tot{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--linha)}
.qr{background:#fff;padding:12px;border-radius:14px;width:fit-content;margin:10px auto}
.ingresso{border:1px dashed #444;border-radius:16px;padding:14px;margin-bottom:14px;text-align:center;background:var(--card)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--txt);color:#000;padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1}#toast.erro{background:var(--erro);color:#fff}
.instalar{display:none;margin:12px 0;align-items:center;gap:12px}
.instalar.on{display:flex}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.galeria img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
footer.rod{padding:30px 0 110px;border-top:1px solid var(--linha);color:var(--txt3);font-size:13px}
.anim-pulsar{animation:pulsar 2s infinite}@keyframes pulsar{50%{transform:scale(1.08)}}
.anim-flutuar{animation:flutuar 3s ease-in-out infinite}@keyframes flutuar{50%{transform:translateY(-4px)}}
.anim-balancar{animation:balancar 2.4s ease-in-out infinite}@keyframes balancar{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.anim-girar{animation:girar 4s linear infinite}@keyframes girar{to{transform:rotateY(360deg)}}
.anim-neon{animation:neon 1.6s infinite}@keyframes neon{50%{filter:drop-shadow(0 0 8px var(--dest)) brightness(1.4)}}
.anim-brilho{animation:brilho 3s infinite}@keyframes brilho{50%{filter:brightness(1.6)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/assets/config.js?v=4"></script>
<script src="/assets/clic.js?v=4"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="marca" href="#/" id="marca"><img id="logo" alt=""><span id="nome-casa">Carregando…</span></a>
  <a class="btn peq" id="b-whats" target="_blank" style="display:none"><i class="ti ti-brand-whatsapp"></i></a>
</div></header>
<main id="app"></main>
<nav class="baixo">
  <a href="#/" data-r="inicio"><i class="ti ti-ticket"></i>Ingressos</a>
  <a href="#/carrinho" data-r="carrinho"><i class="ti ti-shopping-cart"></i>Carrinho<span class="bolha" id="bolha" style="display:none"></span></a>
  <a href="#/meus" data-r="meus"><i class="ti ti-device-mobile"></i>Meus ingressos</a>
</nav>
<div id="toast"></div>
<script src="/casa/casa.js?v=4"></script>
</body>
</html>
